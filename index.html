<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpectroKey</title>
<style>
  :root {
    --bg: #f6f7f9;
    --fg: #1a1d21;
    --muted: #5c6670;
    --panel: #ffffff;
    --border: #c9d0d8;
    --accent: #1f6feb;
    --accent-fg: #ffffff;
    --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b;
      --fg: #e6e9ed;
      --muted: #9aa5b1;
      --panel: #1d2127;
      --border: #3a424c;
      --accent: #4c8dff;
      --accent-fg: #0b0e12;
      --danger: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
    padding: 12px 16px 32px;
    overflow-x: hidden;
  }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  /* Spectrogram grid: [y title | y ticks | canvas], then x ticks and x title under the canvas. */
  .view { display: grid; grid-template-columns: 1.2em 38px minmax(0, 1fr); column-gap: 6px; }
  .y-title { grid-column: 1; writing-mode: vertical-rl; transform: rotate(180deg);
    text-align: center; font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
  .axis { grid-column: 2; position: relative; font-size: 0.7rem; color: var(--muted); }
  .axis span { position: absolute; right: 0; transform: translateY(-50%); white-space: nowrap; }
  .canvas-wrap { grid-column: 3; position: relative; min-width: 0; }
  .x-ticks { grid-column: 3; position: relative; height: 1.3em; margin-top: 2px;
    font-size: 0.7rem; color: var(--muted); }
  .x-ticks span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .x-title { grid-column: 3; text-align: center; font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  canvas { display: block; width: 100%; background: #000; border: 1px solid var(--border); }
  #live-canvas { height: 45vh; min-height: 200px; }
  #live-canvas.paused { cursor: grab; touch-action: pan-y; }
  #live-canvas.paused.dragging { cursor: grabbing; }
  #live-canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #analysis-canvas { height: 260px; image-rendering: pixelated; touch-action: pan-y; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; padding: 12px; text-align: center;
    background: rgba(0, 0, 0, 0.72); color: #fff;
  }
  .overlay[hidden] { display: none; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 12px 0 8px; }
  .controls label { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--muted); }
  .controls input[type=range] { width: 110px; }
  button, select {
    font: inherit; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel); color: var(--fg);
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .overlay button { background: #fff; color: #000; border-color: #fff; }
  .overlay button[hidden] { display: none; }
  #status { min-height: 1.4em; margin: 4px 0 16px; color: var(--muted); font-size: 0.9rem; }
  #status.error { color: var(--danger); }
  /* Echo and Output: labels share one column so both boxes start and end at the same place. */
  #echo { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 10px;
    align-items: center; margin-top: 12px; max-width: 640px; }
  #echo-in, #echo-out { box-sizing: border-box; width: 100%; min-height: 2.2em; font: inherit;
    padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel); color: var(--fg); }
  #echo-out { display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
  @media (max-width: 420px) {
    #echo { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  }
  #analysis { margin-top: 8px; }
  #readout { margin-top: 8px; font-size: 0.9rem; color: var(--muted); }
</style>
</head>
<body>
<h1>SpectroKey</h1>

<div class="view">
  <div class="y-title">Frequency (Hz)</div>
  <div class="axis" id="live-axis" aria-hidden="true"></div>
  <div class="canvas-wrap">
    <canvas id="live-canvas" tabindex="0"
      aria-label="Live spectrogram. While paused, use the left and right arrow keys to scroll back in time."></canvas>
    <div class="overlay" id="live-overlay" role="alert" hidden>
      <div id="live-overlay-msg"></div>
      <button id="retry" type="button">Retry</button>
    </div>
  </div>
  <div class="x-title">Time → (newest on the right)</div>
</div>

<div class="controls">
  <button id="start" class="primary" type="button">Start mic</button>
  <button id="record" type="button" disabled>Record</button>
  <button id="clear" type="button">Clear</button>
  <button id="pause" type="button" disabled aria-pressed="false">Pause</button>
  <label>FFT
    <select id="fft">
      <option>512</option><option>1024</option><option selected>2048</option><option>4096</option><option>8192</option>
    </select>
  </label>
  <label>Scale
    <select id="scale"><option value="linear">Linear</option><option value="log">Log</option></select>
  </label>
  <label>Colormap
    <select id="colormap"><option>viridis</option><option>magma</option><option>gray</option></select>
  </label>
  <label>Floor <input id="floor" type="range" min="-140" max="-20" step="1" value="-100"><output id="floor-out">-100</output> dB</label>
  <label>Ceiling <input id="ceil" type="range" min="-100" max="0" step="1" value="-10"><output id="ceil-out">-10</output> dB</label>
</div>

<div id="echo">
  <label for="echo-in">Echo</label>
  <input id="echo-in" type="text" placeholder="Type something" autocomplete="off">
  <span id="echo-out-label">Output</span>
  <output id="echo-out" for="echo-in" aria-labelledby="echo-out-label" aria-live="polite"></output>
</div>

<div id="status" role="status" aria-live="polite"></div>

<section id="analysis">
  <div class="view">
    <div class="y-title">Frequency (Hz)</div>
    <div class="axis" id="analysis-axis" aria-hidden="true"></div>
    <div class="canvas-wrap"><canvas id="analysis-canvas" aria-label="Recorded clip analysis"></canvas></div>
    <div class="x-ticks" id="analysis-time-axis" aria-hidden="true"></div>
    <div class="x-title">Time (s)</div>
  </div>
  <div id="readout"></div>
  <div class="controls">
    <button id="export-png" type="button" disabled>Export PNG</button>
    <button id="export-wav" type="button" disabled>Export WAV</button>
  </div>
</section>

<script type="module" src="src/app.js"></script>
</body>
</html>
